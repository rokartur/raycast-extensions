# Raycast Extensions Workflow Add New Extension

## Action

Follow the add-new-extension workflow:
1. Create extension directory under extensions/{extension-name}/
2. Add .gitignore, .prettierrc, eslint config, and tsconfig.json files
3. Add package.json and package-lock.json
4. Add README.md and CHANGELOG.md
5. Add assets (icons, images) and metadata screenshots
6. Implement main source files in src/
7. Add initial implementation and utility files
8. Add initial tests if needed
9. Update CHANGELOG.md and optimize images

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: extensions/*/.gitignore, extensions/*/.prettierrc, extensions/*/eslint.config.*

